# Usage-Based Billing System — full stack.
#
#   docker compose up --build
#
# Boot order:
#   1. migrate   : runs Prisma migrations + seed once against the shared DB volume
#   2. backend   : TWO replicas, both using the same SQLite file (proves concurrency)
#   3. gateway   : nginx load balancer distributing /api across the replicas
#   4. frontend  : nginx serving the SPA, proxying /api -> gateway
#
# Access:
#   - Dashboard : http://localhost:8080
#   - API       : http://localhost:8081  (via the gateway, for testing/scripts)

services:
  migrate:
    build:
      context: ./backend
      target: builder
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: "file:/data/app.db?connection_limit=1"
    volumes:
      - db-data:/data
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runner
    environment:
      DATABASE_URL: "file:/data/app.db?connection_limit=1"
      PORT: "3000"
      NODE_ENV: "production"
      BUSY_TIMEOUT_MS: "5000"
    volumes:
      - db-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - gateway

volumes:
  db-data:
