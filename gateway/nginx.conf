events {}

http {
    # Docker's embedded DNS server. Resolving the "backend" service name at
    # request time returns the IPs of ALL replicas, so successive requests are
    # distributed across both backend instances (load balancing).
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location / {
            set $upstream http://backend:3000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
